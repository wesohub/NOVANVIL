<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>星辰熔炉 · 2D 星球生成引擎</title>
<style>
:root{
  --bg:#000;
  --panel:#050505;
  --panel2:#0b0b0b;
  --line:#202020;
  --line2:#3a3a3a;
  --fluo:#3dffd0;
  --txt:#e8e8e8;
  --dim:#7c7c7c;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.5;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#2a2a2a}
::-webkit-scrollbar-thumb:hover{background:#454545}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:8px 10px}
header.topbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;min-height:42px;padding:6px 10px;background:var(--panel);border:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.logo{width:14px;height:14px;border:2px solid #fff;position:relative;flex:none}
.logo::after{content:"";position:absolute;inset:2px;background:var(--fluo)}
h1{font-size:13.5px;letter-spacing:.16em;font-weight:600;white-space:nowrap}
h1 span{color:var(--fluo);font-size:10px;letter-spacing:.2em;margin-left:7px;font-weight:400}
.tools{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0;justify-content:flex-end}
.toolright{display:flex;gap:6px;flex:none;margin-left:6px}

main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:8px;min-height:0}
@media(max-width:1040px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 240px}}

/* ── 舞台 ── */
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;background:var(--panel);border:1px solid var(--line)}
.viewport{position:relative;min-height:0;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.frame{position:relative;line-height:0}
canvas{display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.corner{position:absolute;width:16px;height:16px;border:1px solid rgba(255,255,255,.22);pointer-events:none}
.c1{top:8px;left:8px;border-right:0;border-bottom:0}
.c2{top:8px;right:8px;border-left:0;border-bottom:0}
.c3{bottom:8px;left:8px;border-right:0;border-top:0}
.c4{bottom:8px;right:8px;border-left:0;border-top:0}
.vp-tag{position:absolute;left:12px;bottom:9px;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.42);letter-spacing:.14em;pointer-events:none}
.vp-hint{position:absolute;left:50%;top:9px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.28);pointer-events:none}
.loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;pointer-events:none;
  background:rgba(0,0,0,.86);z-index:5;line-height:1.6}
.loader.on{display:flex}
.ring{width:34px;height:34px;border:1px solid #262626;border-top-color:var(--fluo);animation:spin2 .8s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.loader p{font-family:var(--mono);font-size:11px;color:var(--fluo);letter-spacing:.14em}

/* ── 控制条 ── */
.controls{padding:7px 8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.row{display:flex;gap:6px;align-items:center;min-width:0}
button{
  font-family:inherit;font-size:11.5px;color:#dcdcdc;background:#0b0b0b;
  border:1px solid var(--line2);border-radius:0;padding:5px 10px;cursor:pointer;
  transition:.14s;letter-spacing:.05em;white-space:nowrap}
button:hover{border-color:#fff;color:#fff;background:#161616}
button:active{background:#000}
button.primary{border-color:var(--fluo);color:var(--fluo)}
button.primary:hover{background:rgba(61,255,208,.12);color:#fff;border-color:var(--fluo)}
button.on{border-color:#fff;background:#fff;color:#000}
button:disabled{opacity:.35;cursor:not-allowed}

select,input[type=text]{
  font-family:var(--mono);font-size:11.5px;color:#fff;background:#000;
  border:1px solid var(--line2);border-radius:0;height:26px;padding:0 7px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--fluo)}
select{flex:1;min-width:0}
input[type=text]{flex:1.2;min-width:0}

/* ── 信息面板（标签式） ── */
.panel{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;background:var(--panel);border:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:transparent;border:0;border-right:1px solid var(--line);padding:8px 2px;
  font-size:11px;letter-spacing:.1em;color:var(--dim);font-family:var(--mono)}
.tabs button:last-child{border-right:0}
.tabs button:hover{background:#101010;color:#fff;border-color:var(--line)}
.tabs button.on{color:#fff;background:#0e0e0e;box-shadow:inset 0 -2px 0 var(--fluo)}
.tabbody{min-height:0;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:9px}
.tabpane{display:none;flex-direction:column;gap:9px}
.tabpane.on{display:flex}

.card{background:#000;border:1px solid var(--line);padding:11px}
.card h3{font-size:10px;letter-spacing:.18em;color:var(--dim);font-weight:500;margin-bottom:9px;
  display:flex;align-items:center;gap:8px;font-family:var(--mono)}
.card h3::after{content:"";flex:1;height:1px;background:var(--line)}
.cntbadge{font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.08em;
  color:var(--dim);white-space:nowrap}
.cntbadge b{color:var(--fluo);font-weight:500}

.idcard{border-color:var(--line2)}
.typetag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  padding:3px 8px;border:1px solid currentColor;margin-bottom:8px}
.dot{width:6px;height:6px;background:currentColor}
.pname{font-size:19px;font-weight:700;letter-spacing:.02em;line-height:1.2;color:#fff;word-break:break-word}
.pepi{font-size:12px;color:var(--fluo);margin-top:3px;letter-spacing:.04em}
.pseed{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:7px;letter-spacing:.06em}
.pseed b{color:var(--fluo);font-weight:500;cursor:pointer}
.pdesc{font-size:11.5px;color:#9c9c9c;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);min-height:34px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.st{background:#000;padding:7px 9px}
.st .k{font-size:9.5px;color:var(--dim);letter-spacing:.08em;font-family:var(--mono)}
.st .v{font-size:13px;color:#fff;font-family:var(--mono);font-weight:600;margin-top:1px}
.st .v small{font-size:9.5px;color:var(--dim);font-weight:400;margin-left:2px}
.st.wide{grid-column:1/-1}

.bar{height:3px;background:#1c1c1c;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .5s}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10.5px;padding:3px 8px;background:#0a0a0a;border:1px solid #2c2c2c;color:#c8c8c8;letter-spacing:.02em}
.chip.good{background:#0a0a0a;border-color:rgba(255,255,255,.42);color:#fff}
.chip.warn{background:rgba(61,255,208,.06);border-color:var(--fluo);color:var(--fluo)}
.chip.gold{background:#0a0a0a;border-color:#3a3a3a;color:#b4b4b4}

/* ── 档案 ── */
.arch{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.arc{position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer;background:#000;
  border:1px solid var(--line);transition:.14s}
.arc:hover{border-color:var(--fluo);z-index:2}
.arc img{width:100%;height:100%;display:block;object-fit:cover}
.arc span{position:absolute;left:0;right:0;bottom:0;font-size:9px;text-align:center;
  background:rgba(0,0,0,.78);padding:2px;color:#e8e8e8;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.empty{color:var(--dim);font-size:11px;text-align:center;padding:14px 0;font-family:var(--mono)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);opacity:0;
  background:#000;border:1px solid var(--fluo);color:var(--fluo);
  padding:7px 16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
  transition:.3s;pointer-events:none;z-index:200}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 预览窗内嵌控件（左上暂停 / 右上光照归位 / 右下缩放）──
   直接贴在观测窗上，省掉外侧一整条控制行；
   半透明深底 + 1px 冷灰描边，不抢星体主体的视觉权重 */
.vpctl{position:absolute;inset:0;pointer-events:none;z-index:4}
.vpc-group{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:4px}
/* 左上 / 右上横排；下移到角标之下，不与取景框角标叠压 */
.vpc-spin{left:10px;top:30px;flex-direction:row}
.vpc-light{right:10px;top:30px;flex-direction:row}
.vpc-zoom{right:10px;bottom:10px;flex-direction:row}
.vpc-val{font-family:var(--mono);font-size:9px;line-height:1;color:rgba(255,255,255,.5);letter-spacing:.04em}
.vpc-btn{
  width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;line-height:1;color:#dcdcdc;
  background:rgba(8,8,8,.74);border:1px solid var(--line2);border-radius:0;
  cursor:pointer;transition:.14s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.vpc-btn:hover{border-color:#fff;color:#fff;background:rgba(22,22,22,.9)}
.vpc-btn.on{border-color:var(--fluo);color:var(--fluo);background:rgba(61,255,208,.14)}

/* ── 操作按钮条的两套落位 ──
   桌面：重掷 / 生成 在顶栏中部，存入 / 导出 在顶栏右上角
   手机：JS 把 .tools（高频两项）搬进 .oprow（预览窗正下方，拇指区），
        .toolright（低频两项）留在右上角；两项等分一行 */
.oprow{display:flex}
.oprow:empty{display:none}
.oprow .tools{flex:1;min-width:0;flex-wrap:wrap;justify-content:flex-start;gap:6px;
  overflow:visible;-webkit-mask-image:none;mask-image:none}
.oprow .tools button{flex:1 1 0}

/* ══════════════════════════════════════════════════════════════════════
   移动端版式系统
   ─────────────────────────────────────────────────────────────────────
   竖屏（≤800px 且 portrait）：三区锁定构图，整屏不滚动
       ① 状态栏  品牌 + 右上角「存入档案 / 导出 PNG」
       ② 观测窗  高度 auto —— 严格贴合画布等比结果，不留被动黑边；
                 窗内左上=暂停，右上=光照归位，右下=缩放加减
       ③ 控制台  高频操作（同型重掷 / 随机生成）→ 选择器
       ④ 数据席  吃掉全部剩余高度，内部滚动；合成计数在档案卡片标题行
   横屏（landscape 且 ≤560px 高）：矮屏双栏，观测窗吃满高度，右侧窄数据席
   触屏（hover:none / pointer:coarse）：清粘滞 hover、放大触控目标
   ─────────────────────────────────────────────────────────────────────
   桌面规则零改动，以下全部为媒体查询内覆盖
   ══════════════════════════════════════════════════════════════════════ */

/* ── 触屏：清除点按后残留的 hover 高亮 ── */
@media (hover:none){
  button:not(.on):not(.primary):hover{border-color:var(--line2);color:#dcdcdc;background:#0b0b0b}
  button.primary:not(.on):hover{background:#0b0b0b;color:var(--fluo);border-color:var(--fluo)}
  .tabs button:not(.on):hover{background:transparent;color:var(--dim);border-color:var(--line)}
  .arc:hover{border-color:var(--line)}
}
/* ── 触屏：触控目标 ≥34px（拇指命中区） ── */
@media (pointer:coarse){
  button{padding:7px 11px;min-height:34px;font-size:12px}
  select,input[type=text]{height:34px;font-size:12px}
  .tabs button{min-height:44px}
  .vpc-btn{width:34px;height:34px;min-height:34px}
}

/* ═══════════ 手机竖屏 ═══════════ */
@media (max-width:800px) and (orientation:portrait){
  html,body{height:100vh}
  html,body{height:100dvh}
  .app{display:flex;flex-direction:column;gap:0;padding:0}

  /* ① 状态栏：品牌 + 右上角（存入档案 / 导出 PNG），操作按钮已下移到预览窗下方 */
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:0;
    padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 6px calc(10px + env(safe-area-inset-left));
    border:0;border-bottom:1px solid var(--line);
  }
  h1{font-size:12.5px}
  h1 span{display:none}                       /* 副标 STELLAR FORGE 让位 */

  /* ② 观测窗：高度由画布等比结果决定，余量全部下放给数据席 */
  main{flex:1;display:flex;flex-direction:column;gap:0;min-height:0}
  .stage{flex:none;grid-template-rows:auto auto;border:0;border-bottom:1px solid var(--line)}

  /* ③ 控制台：操作按钮行 → 选择器，逐级向下 */
  .controls{padding:8px;gap:7px;border-top:0}
  .controls .row{flex-wrap:wrap;gap:6px}
  .controls .row select{flex:1 1 calc(50% - 3px)}
  .controls .row input[type=text]{flex:1 1 120px}
  .controls .row button{flex:none}
  .controls .row #resSel{flex:1 1 100%}       /* 分辨率独占一行：档位文字长，挤进半宽会被截断 */

  /* 视口角标适配窄屏；提示语撤掉（控件已自解释） */
  .corner{width:11px;height:11px}
  .c1{top:6px;left:6px}.c2{top:6px;right:6px}.c3{bottom:6px;left:6px}
  .c4{display:none}                          /* 右下角标让位给缩放控件 */
  .vp-tag{left:8px;bottom:6px;font-size:9px;letter-spacing:.1em;max-width:62%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vp-hint{display:none}

  /* ④ 数据席：占满剩余高度，内部滚动，底部留出 Home 条安全区 */
  .panel{flex:1;min-height:0;border:0;border-top:1px solid var(--line)}
  .tabs button{padding:10px 2px;font-size:11px}
  .tabbody{padding:8px;gap:8px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .card{padding:10px}
  .pname{font-size:17px}
  .arch{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:5px}
  .toast{bottom:calc(14px + env(safe-area-inset-bottom))}
}

/* ═══════════ 手机横屏（矮屏） ═══════════ */
@media (orientation:landscape) and (max-height:560px){
  html,body{height:100vh}
  html,body{height:100dvh}
  .app{display:flex;flex-direction:column;gap:0;padding:0}
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:0;
    padding:4px calc(10px + env(safe-area-inset-right)) 4px calc(10px + env(safe-area-inset-left));
    border:0;border-bottom:1px solid var(--line);
  }
  h1 span{display:none}

  main{flex:1;grid-template-columns:minmax(0,1fr) 252px;grid-template-rows:minmax(0,1fr);gap:0;min-height:0}
  .stage{border:0;border-right:1px solid var(--line)}
  .panel{border:0}
  /* 矮屏下按钮条压成单行横滑，不额外吃掉观测窗高度 */
  .oprow .tools{flex-wrap:nowrap;gap:5px;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .oprow .tools::-webkit-scrollbar{display:none}
  .oprow .tools button{flex:none}
  .controls{padding:5px 6px;gap:5px}
  .controls .row{gap:5px}
  .tabbody{padding:7px;gap:7px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .card{padding:8px}
  .pname{font-size:16px}
  .arch{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:4px}
  .c4{display:none}
  .vp-hint{display:none}
  .vp-tag{font-size:9px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <h1>星辰熔炉<span>STELLAR FORGE</span></h1>
    </div>
    <div class="tools" id="tools">
      <button id="btnReroll" title="保持当前大类（与亚型）不变，重新掷一次纹理">↻ 同型重掷</button>
      <button class="primary" id="btnGen" title="按当前大类 / 亚型随机生成一颗新星">◈ 随机生成新星</button>
    </div>
    <div class="toolright" id="toolright">
      <button id="btnSave">＋ 存入档案</button>
      <button id="btnPng">⤓ 导出 PNG</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="viewport">
        <div class="frame">
          <canvas id="scene" width="900" height="640"></canvas>
          <div class="corner c1"></div><div class="corner c2"></div>
          <div class="corner c3"></div><div class="corner c4"></div>
          <div class="vp-tag" id="vptag">SCAN // 待机</div>
          <div class="vp-hint">拖动=光照（相对位移）· 滚轮=缩放 · 双击=暂停</div>
          <div class="loader" id="loader"><div class="ring"></div><p id="loadtxt">正在合成星体…</p></div>
        </div>
        <div class="vpctl">
          <div class="vpc-group vpc-spin">
            <button class="vpc-btn" id="btnPause" title="暂停 / 继续">⏸</button>
          </div>
          <div class="vpc-group vpc-light">
            <button class="vpc-btn" id="btnLightReset" title="光照归位（方位 -38° · 仰角 18°）">☉</button>
          </div>
          <div class="vpc-group vpc-zoom">
            <b class="vpc-val" id="vZoom">1.00</b>
            <button class="vpc-btn" id="btnZoomIn" title="放大">＋</button>
            <button class="vpc-btn" id="btnZoomOut" title="缩小">－</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="oprow" id="oprow"></div>
        <div class="row">
          <select id="typeSel" title="星体大类"></select>
          <select id="subSel" title="大类下的细分形态（纹理配方不同）"></select>
          <input type="text" id="seedInput" placeholder="输入种子复现星体…" spellcheck="false">
          <button id="btnSeed">载入种子</button>
          <select id="resSel" title="星球分辨率：纹理 / 球面离屏渲染 / 画布输出三者等比提升 —— 越高越清晰，合成耗时与内存也越高"></select>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs" id="tabs">
        <button data-tab="ov" class="on">概览</button>
        <button data-tab="ps">参数</button>
        <button data-tab="ar">档案</button>
      </div>
      <div class="tabbody">
        <div class="tabpane on" data-pane="ov">
          <div class="card idcard">
            <div class="typetag" id="typetag"><i class="dot"></i><span>未知</span></div>
            <div class="pname" id="pname">—</div>
            <div class="pepi" id="pepi">—</div>
            <div class="pseed">SEED <b id="pseed" title="点击复制">—</b></div>
            <div class="pdesc" id="pdesc">点击「随机生成新星」开始探索。</div>
          </div>
          <div class="card">
            <h3>宜居指数</h3>
            <div class="stats">
              <div class="st wide">
                <div class="k">HABITABILITY INDEX</div>
                <div class="v" id="habV">—</div>

<script>
"use strict";
/* =====================================================================
   星辰熔炉 —— 程序化 2D 星球生成引擎
   流程：球面 3D 噪声 → 等距柱状纹理(1024×512) → 正交投影反解经纬度
        → 经度加旋转相位采样（纹理在圆内横向流动＝自转错觉）
        → WebGL2 片元着色器逐像素光照(与旋转无关，瞬时叠加) → 大气辉光 / 星空合成
   ===================================================================== */

/* ───────── 伪随机 ───────── */
function xmur3(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){
    h=Math.imul(h^str.charCodeAt(i),3432918353);
    h=h<<13|h>>>19;
  }
  return function(){
    h=Math.imul(h^h>>>16,2246822507);
    h=Math.imul(h^h>>>13,3266489909);
    return (h^=h>>>16)>>>0;
  };
}
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function makeRng(seedStr){
  const s=xmur3(String(seedStr));
  return mulberry32(s());
}
const rnd=(r,a,b)=>a+r()*(b-a);
const rint=(r,a,b)=>Math.floor(a+r()*(b-a+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const chance=(r,p)=>r()<p;
function pickMany(r,arr,n){
  const c=arr.slice(),o=[];
  while(o.length<n&&c.length)o.push(c.splice(Math.floor(r()*c.length),1)[0]);
  return o;
}

/* ───────── 数学 ───────── */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const clamp01=v=>v<0?0:v>1?1:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function smoothstep(a,b,x){ x=clamp01((x-a)/(b-a)); return x*x*(3-2*x); }

/* ───────── 3D Perlin 噪声（球面采样无缝） ───────── */
function makeNoise3D(rand){
  const perm=new Uint8Array(256);
  for(let i=0;i<256;i++)perm[i]=i;
  for(let i=255;i>0;i--){const j=Math.floor(rand()*(i+1));const t=perm[i];perm[i]=perm[j];perm[j]=t;}
  const p=new Uint8Array(512);
  for(let i=0;i<512;i++)p[i]=perm[i&255];
  const fade=t=>t*t*t*(t*(t*6-15)+10);
  const L=(t,a,b)=>a+(b-a)*t;
  function grad(h,x,y,z){
    switch(h&15){
      case 0:return x+y;case 1:return -x+y;case 2:return x-y;case 3:return -x-y;
      case 4:return x+z;case 5:return -x+z;case 6:return x-z;case 7:return -x-z;
      case 8:return y+z;case 9:return -y+z;case 10:return y-z;case 11:return -y-z;
      case 12:return x+y;case 13:return -y+z;case 14:return x-y;default:return -y-z;
    }
  }
  return function(x,y,z){
    const X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;
    const fx=x-Math.floor(x),fy=y-Math.floor(y),fz=z-Math.floor(z);
    const u=fade(fx),v=fade(fy),w=fade(fz);
    const A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z;
    const B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
    return L(w,
      L(v,L(u,grad(p[AA],fx,fy,fz),grad(p[BA],fx-1,fy,fz)),
              L(u,grad(p[AB],fx,fy-1,fz),grad(p[BB],fx-1,fy-1,fz))),
      L(v,L(u,grad(p[AA+1],fx,fy,fz-1),grad(p[BA+1],fx-1,fy,fz-1)),
              L(u,grad(p[AB+1],fx,fy-1,fz-1),grad(p[BB+1],fx-1,fy-1,fz-1))));
  };
}

/* 分形叠加（lac/gain/oct 的缺省值由噪声函数自带的随机谱决定） */
function fbm(n,x,y,z,oct,lac,gain){
  oct=(oct||5)+(n.octBias||0);oct=oct<2?2:(oct>9?9:oct);
  lac=lac||n.lac||2.0;gain=gain===undefined?(n.gain===undefined?0.5:n.gain):gain;
  let a=1,f=1,s=0,nm=0;
  for(let i=0;i<oct;i++){s+=a*n(x*f,y*f,z*f);nm+=a;a*=gain;f*=lac;}
  // tanh 软限幅：输出严格落在 (-1,1)，于是 *0.5+0.5 与「权重和=1」的加权和
  // 都不再越界 → 幅度上调时表现为层次压缩，而不是被 ramp 截成整片端点色。
  // 典型幅值（|v|≤0.5）变化 <8%，只有极值区被压。
  return Math.tanh(s/nm*1.75);
}
/* 脊状噪声：山脉 / 裂缝 / 能量流 */
function ridged(n,x,y,z,oct,lac,gain){
  oct=(oct||5)+(n.octBias||0);oct=oct<2?2:(oct>9?9:oct);
  lac=lac||n.lac||2.0;gain=gain===undefined?(n.gain===undefined?0.5:n.gain):gain;
  let a=1,f=1,s=0,nm=0;
  for(let i=0;i<oct;i++){
    const v=1-Math.abs(n(x*f,y*f,z*f));
    s+=a*v*v;nm+=a;a*=gain;f*=lac;
  }
  return s/nm;
}
/* 湍流：域扭曲后的 fbm，用于气态条带 */
function turb(n,x,y,z,oct){
  const q=fbm(n,x+11.3,y+4.7,z+2.1,3);
  const w=fbm(n,x*1.7+q,y*1.7+q*0.6,z*1.7,3);
  return fbm(n,x+w*0.9,y+w*0.9,z+w*0.9,oct||4);
}

/* ───────── 极地冰盖 ─────────
   真实冰盖 = 蜿蜒冰缘 + 海冰破碎 / 陆冰连续 + 冰面穹顶起伏
   ① 冰缘：纬度线被低频噪声推移，边缘呈锯齿 / 岬湾状，非均匀圆环
   ② 海冰：外缘碎成浮冰与水道，越靠极点越连片；陆冰连续且雪线更低
   ③ 冰面：低频起伏输出到 out[0]，供调用处做明暗（穹顶高光 / 冰纹）
   edge：冰盖起始纬度(|sin lat|)  warp：冰缘扰动幅度  pha：随机相位  isSea：该点是否海域
   返回 0-1 覆盖强度；非极区像素提前返回，不付噪声开销 */
function iceCap(n,nx,ny,nz,latf,edge,warp,pha,isSea,out){
  if(latf<edge-warp-0.10){out[0]=0.5;return 0;}
  const wv=fbm(n,nx*1.5+pha,ny*0.9,nz*1.5,4);      // 大尺度冰缘扭曲
  const fv=fbm(n,nx*6.5+pha*2,ny*6.5+7,nz*6.5,3);  // 高频碎冰
  const e=edge-clamp(wv,-1,1)*warp;
  let t=smoothstep(e,e+0.10,latf);
  if(isSea){
    const frag=smoothstep(0.34,0.60,fv*0.5+0.5);   // 浮冰块
    const solid=smoothstep(e+0.12,e+0.32,latf);    // 近极点连片
    t*=frag+(1-frag)*solid;
  }
  out[0]=wv*0.5+0.5;
  return clamp01(t);
}

/* ───────── 3D Worley（细胞噪声）：陨石坑 / 晶面 / 米粒组织 ───────── */
function makeWorley3D(rand){
  const mk=()=>{const a=new Uint8Array(256);for(let i=0;i<256;i++)a[i]=i;
    for(let i=255;i>0;i--){const j=Math.floor(rand()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
  const A=mk(),B=mk(),C=mk(),D=mk();
  return function(x,y,z,out){
    const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
    let f1=1e9,f2=1e9,id=0;
    for(let dz=-1;dz<=1;dz++){
      const cz=zi+dz,czk=C[cz&255];
      for(let dy=-1;dy<=1;dy++){
        const cy=yi+dy,cq=B[cy&255];
        for(let dx=-1;dx<=1;dx++){
          const cx=xi+dx;
          const h=(A[cx&255]+cq+czk)&255;
          const px=cx+A[h]/255,py=cy+B[h]/255,pz=cz+C[h]/255;
          const ex=px-x,ey=py-y,ez=pz-z;
          const d=ex*ex+ey*ey+ez*ez;
          if(d<f1){f2=f1;f1=d;id=D[h]/255;}
          else if(d<f2){f2=d;}
        }
      }
    }
    out[0]=Math.sqrt(f1);out[1]=Math.sqrt(f2);out[2]=id;
  };
}

/* ───────── 随机域旋转 ─────────
   同一套噪声的统计形态是固定的，光靠平移常量（+cf / +31 / +70 …）换不出
   真正不同的地形走向。给每颗星球一个随机正交矩阵，先把采样坐标旋转再喂给
   噪声 → 大陆走向、山脉方位、细胞排布全变，代价 9 次乘加。
   顺带把分形参数挂在噪声函数上（lacunarity / gain / 倍频偏移），
   fbm / ridged 未显式传参时回落到这组值 → 每颗星球的粗糙度谱也不同 */
function randRot(rand){
  const a=rand()*TAU,b=Math.acos(rand()*2-1),g=rand()*TAU;
  const sa=Math.sin(a),ca=Math.cos(a),sb=Math.sin(b),cb=Math.cos(b),sg=Math.sin(g),cg=Math.cos(g);
  return [cg*ca-sg*cb*sa, -cg*sa-sg*cb*ca, sg*sb,
          sg*ca+cg*cb*sa, -sg*sa+cg*cb*ca, -cg*sb,
          sb*sa, sb*ca, cb];
}
function rotNoise(fn,rand){
  const m=randRot(rand);
  /* 每种子地形疏密：各轴独立频率缩放 0.78-1.28 —— 同亚型不同种子的
     地貌骨架（大陆块数、岛链间距、沙丘密度）被整体拉伸/压缩，y 轴
     独立缩放使经向/纬向特征密度可以不对称 */
  const kx=0.78+rand()*0.50,ky=0.78+rand()*0.50,kz=0.78+rand()*0.50;
  const o=function(x,y,z){
    return fn(m[0]*x*kx+m[1]*y*ky+m[2]*z*kz,
              m[3]*x*kx+m[4]*y*ky+m[5]*z*kz,
              m[6]*x*kx+m[7]*y*ky+m[8]*z*kz);
  };
  o.lac=1.70+rand()*0.70;
  o.gain=0.42+rand()*0.20;
  const ob=rand();
  o.octBias=ob<0.34?-1:(ob<0.67?0:1);
  return o;
}
function rotWorley(fn,rand){
  const m=randRot(rand);
  /* 与 rotNoise 同理：Worley 细胞（海峡网 / 陨击坑阵列 / 龟裂）也随
     种子做各轴独立缩放，细胞密度每颗星球不同 */
  const kx=0.78+rand()*0.50,ky=0.78+rand()*0.50,kz=0.78+rand()*0.50;
  return function(x,y,z,out){
    return fn(m[0]*x*kx+m[1]*y*ky+m[2]*z*kz,
              m[3]*x*kx+m[4]*y*ky+m[5]*z*kz,
              m[6]*x*kx+m[7]*y*ky+m[8]*z*kz, out);
  };
}

/* ───────── 调色板 ───────── */
function hsl2rgb(h,s,l){
  // 兼容两种写法：0-1 小数 与 0-100 百分比。
  // （旧代码里大气色 / 辉光色都写成 72、64 这类百分比，
  //   被 clamp01 直接截成 1 → l=1 时 c=0，所有颜色都变成纯白）
  if(s>1)s/=100;
  if(l>1)l/=100;
  h=((h%360)+360)%360;s=clamp01(s);l=clamp01(l);
  const c=(1-Math.abs(2*l-1))*s,hp=h/60,x=c*(1-Math.abs(hp%2-1));
  let r=0,g=0,b=0;
  if(hp<1){r=c;g=x;}else if(hp<2){r=x;g=c;}else if(hp<3){g=c;b=x;}
  else if(hp<4){g=x;b=c;}else if(hp<5){r=x;b=c;}else{r=c;b=x;}
  const m=l-c/2;
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function mixc(a,b,t,o){
  o[0]=a[0]+(b[0]-a[0])*t;o[1]=a[1]+(b[1]-a[1])*t;o[2]=a[2]+(b[2]-a[2])*t;return o;
}

/* 用 HSL 定义便于随机色相偏移 */
function Pal(list,shift,sat,lum){
  shift=shift||0;sat=sat===undefined?1:sat;lum=lum===undefined?1:lum;
  return list.map(c=>{
    // 色域约束：亮度封顶 0.94 —— 再高 hsl2rgb 会把 l 夹成 1，颜色退化成
    // 纯白、丢掉色相（随机上调明度时最容易踩）。对现有色板（lum ≤ 94）幂等。
    let l=c[2]/100*lum;
    if(l>0.94)l=0.94;else if(l<0)l=0;
    return hsl2rgb(c[0]+shift,clamp01(c[1]/100*sat),l);
  });
}

/* ───────── 风暴（气态行星涡旋） ───────── */
function makeStorms(rand,n,latRange){
  const st=[];
  const count=n;
  for(let i=0;i<count;i++){
    st.push({
      lon:rand()*TAU,
      lat:rnd(rand,-latRange,latRange),
      r:rnd(rand,0.12,0.42),
      swirl:rnd(rand,1.2,4.2)*(rand()<0.5?-1:1),
      big:rand()<0.34
    });
  }
  return st;
}
/* 对经纬度做漩涡扭曲，返回命中强度 */
function applyStorms(storms,lon,lat,G){
  let hit=0,hid=0,olon=lon,olat=lat;
  for(let i=0;i<storms.length;i++){
    const s=storms[i];
    let dlon=olon-s.lon;
    while(dlon>PI)dlon-=TAU; while(dlon<-PI)dlon+=TAU;
    const dlat=olat-s.lat;
    const d2=dlon*dlon+dlat*dlat;
    if(d2<s.r*s.r){
      const d=Math.sqrt(d2)/s.r;
      const w=(1-d)*(1-d);
      const ang=w*s.swirl;
      const cs=Math.cos(ang),sn=Math.sin(ang);
      olon=s.lon+dlon*cs-dlat*sn;
      olat=s.lat+dlon*sn+dlat*cs;
      if(w>hit){hit=w;hid=i;}
    }
  }
  G.lon=olon;G.lat=olat;G.storm=hit;G.stormId=hid;
  return hit;
}

/* ───────── 纹理分辨率 ───────── */
/* 随「星球分辨率」档位等比缩放（见 RES_STEPS / setResolution），默认 1024×512 */
let TW=1024,TH=512;

/* out: [r,g,b,emissive,specular,cloud]  0-255 */
function buildRows(cfg,py0,py1,alb,em,spec,cld){
  const n=cfg.noise,w=cfg.worley,gen=cfg.gen;
  const o=cfg._o;
  const cosT=cfg._cosT,sinT=cfg._sinT;
  for(let py=py0;py<py1;py++){
    const v=(py+0.5)/TH;
    const lat=(0.5-v)*PI;
    const ny=Math.sin(lat),rc=Math.cos(lat);
    let rowOff=py*TW;
    for(let px=0;px<TW;px++){
      const u=(px+0.5)/TW;
      const lon=u*TAU;
      const G=cfg._G;
      G.nx=cosT[px]*rc;G.ny=ny;G.nz=sinT[px]*rc;
      G.lat=lat;G.lon=lon;G.u=u;G.v=v;G.storm=0;G.stormId=0;
      gen(cfg,G,o);
      const i3=(rowOff+px)*3,i1=rowOff+px;
      // 钳制后再写入，避免 Uint8Array 溢出回绕产生亮斑噪点
      const r=o[0],g=o[1],b=o[2];
      alb[i3]=r<0?0:(r>255?255:r);
      alb[i3+1]=g<0?0:(g>255?255:g);
      alb[i3+2]=b<0?0:(b>255?255:b);
      // 同上：这两路没有 albedo 那样的钳制，超 255 会按 256 回绕出黑斑/逆色
      em[i1]=o[3]<0?0:(o[3]>255?255:o[3]);
      spec[i1]=o[4]<0?0:(o[4]>255?255:o[4]);
      // 云层降占比：1.5 次幂压缩，抬高可见阈值 → 覆盖面积略缩、整体微淡
      // （cv>255 时 sqrt 项从压缩转为放大，必须先钳制再写）
      const cv=o[5],cw=cv>0?cv*Math.sqrt(cv/255):0;
      cld[i1]=cw<0?0:(cw>255?255:cw);
    }
  }
}
function buildTextureAsync(cfg,onProg){
  return new Promise(resolve=>{
    const alb=new Uint8Array(TW*TH*3),em=new Uint8Array(TW*TH),
          spec=new Uint8Array(TW*TH),cld=new Uint8Array(TW*TH);
    const step=16;
    let py=0;
    function chunk(){
      const e=Math.min(TH,py+step);
      buildRows(cfg,py,e,alb,em,spec,cld);
      py=e;
      if(onProg)onProg(py/TH);
      if(py<TH) setTimeout(chunk,0);
      else resolve({alb,em,spec,cld,w:TW,h:TH});
    }
    chunk();
  });
}

/* ═══════════════════════════════════════════════════════════════
   星球形态库：每种形态 = 配色方案 + 噪声配方 + 特征开关
   ═══════════════════════════════════════════════════════════════ */
function ramp(pal,t,o){
  t=clamp01(t)*(pal.length-1);
  const i=Math.min(pal.length-2,Math.floor(t));
  return mixc(pal[i],pal[i+1],t-i,o);
}

/* ═══════════════════════════════════════════════════════════════
   形态细分调度器
   每个大类 = 若干「亚型 SUB」；亚型之间的差异体现在
   ① 噪声配方（fbm / ridged / worley / 条带 的搭配与频率）
   ② 结构骨架（板块 / 网格 / 环带 / 细胞 / 裂隙 …）
   ③ 调色板与色相区间
   因此同大类反复重掷也会得到形态明显不同的星体。
   ═══════════════════════════════════════════════════════════════ */
function pickSub(rand,subs){
  let tot=0;for(let i=0;i<subs.length;i++)tot+=(subs[i].w||1);
  let r=rand()*tot;
  for(let i=0;i<subs.length;i++){r-=(subs[i].w||1);if(r<=0)return i;}
  return subs.length-1;
}
function initSub(bm,rand,cfg,idx){
  const subs=bm.subs;
  if(idx==null||!(idx>=0)||idx>=subs.length)idx=pickSub(rand,subs);
  const sv=subs[idx];
  cfg.subIndex=idx;cfg.subName=sv.name;cfg.sub=sv;
  /* 配色走独立 rng（不占用主 rand），并在三个维度同时随机：
     色相区间整体放大 1.0-1.6 倍 / 饱和度 ± / 明度 ±。
     明度经 Pal() 的色域约束封顶，不会把亮色推成纯白 */
  const pr=cfg._prand||rand;
  const hs=(sv.hs===undefined?14:sv.hs)*(1+pr()*0.6);
  const hShift=rnd(pr,-hs,hs);
  /* 双段偏移（30%）：色卡前半 / 后半做相反方向色相偏移 → 部分种子出

function syl(rand){
  return pick(rand,ONSETS)+pick(rand,VOWELS)+pick(rand,CODAS);
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function makeNameOnce(rand,biome){
  const style=pick(rand,["mythic","mythic","alien","catalog","colonial","fantasy"]);
  let name="";
  if(style==="mythic"){
    const n=rint(rand,2,3);for(let i=0;i<n;i++)name+=syl(rand);
    name=cap(name);
    if(chance(rand,0.45))name+=" "+pick(rand,ROMAN);
  }else if(style==="alien"){
    const a=cap(syl(rand)),b=syl(rand);
    name=a+(chance(rand,0.55)?"'":"")+(chance(rand,0.5)?cap(b):b);
    if(chance(rand,0.22))name+=" "+cap(syl(rand));
  }else if(style==="catalog"){
    const c=pick(rand,CATS);
    const num=chance(rand,0.3)?(rint(rand,100,9999)+"."+rint(rand,1,99)):rint(rand,100,9999);
    name=c+(chance(rand,0.5)?" ":"-")+num;
    name+=" "+String.fromCharCode(98+rint(rand,0,6));
  }else if(style==="colonial"){
    const p=pick(rand,PLACES);
    name=pick(rand,["New "+p,"Port "+p,p+" Reach",p+" Station","Fort "+p,p+" Landing","New "+p+" Colony"]);
  }else{
    const n=rint(rand,2,3);for(let i=0;i<n;i++)name+=syl(rand);
    name=cap(name)+pick(rand,SUFFIX);
    if(chance(rand,0.28))name="The "+name;
  }
  const epi="「"+pick(rand,ADJ)+pick(rand,NOUN)+(chance(rand,0.35)?"·"+pick(rand,CNUM):"")+"」";
  return {name:name,epi:epi,style:style};
}
/* 过滤过长 / 拗口的组合 */
function genName(rand,biome){
  let best=null;
  for(let k=0;k<5;k++){
    const r=makeNameOnce(rand,biome);
    if(!best||r.name.length<best.name.length)best=r;
    if(r.name.length<=12&&!/sss|nnn|rrr|lll|ttt|(.)\1\1/i.test(r.name))return r;
  }
  return best;
}

/* ═══════════════════════════════════════════════════════════════
   档案数据生成：直径/质量/重力/温度/周期/资源
   ═══════════════════════════════════════════════════════════════ */
function genStats(rand,bm,traits){
  const m=bm.meta;
  const dia=Math.round(rnd(rand,m.dia[0],m.dia[1])/10)*10;
  const dens=rnd(rand,m.dens[0],m.dens[1]);
  const dr=dia/12742;
  const mass=dens*Math.pow(dr,3);
  const grav=mass/(dr*dr);
  const temp=Math.round(rnd(rand,m.temp[0],m.temp[1]));
  const rot=+rnd(rand,m.rot[0],m.rot[1]).toFixed(rotFmt(m.rot));
  const orb=m.orb[1]>0?Math.round(rnd(rand,m.orb[0],m.orb[1])):0;
  const atmos=pick(rand,m.atmos);
  const res=pickMany(rand,m.res,rint(rand,2,Math.min(4,m.res.length)));
  // 宜居：基础 - 温度偏离惩罚 - 随机
  let hab=m.hab;
  hab-=clamp(Math.abs(temp-15)/3.2,0,55);
  hab+=rnd(rand,-8,10);
  if(traits.some(t=>t.indexOf("辐射")>=0))hab-=14;
  hab=Math.round(clamp(hab,0,99));
  let haz=100-hab;
  haz=Math.round(clamp(haz+rnd(rand,-6,8),1,100));
  return {dia:dia,mass:mass,grav:grav,temp:temp,rot:rot,orb:orb,atmos:atmos,res:res,hab:hab,haz:haz};
}
function rotFmt(r){return r[1]<10?2:(r[1]<100?1:0);}
function hazLabel(h){
  if(h<20)return"极低 · I 级";if(h<40)return"低 · II 级";
  if(h<60)return"中等 · III 级";if(h<80)return"高 · IV 级";return"极端 · V 级";
}
function habLabel(h){
  if(h<10)return"不适宜居住";if(h<30)return"需全封闭基地";
  if(h<55)return"需生命维持";if(h<75)return"可改造殖民地";return"类地宜居住";
}

let tmp=[0,0,0];
let tmp2=[0,0,0];

async function createPlanet(seedStr,onProg){
  const [tkey,subIdx,salt]=parseSeed(seedStr);
  const rand=makeRng(seedStr);
  const bm=BIOMES[tkey]||BIOMES.terran;

  const cosT=new Float32Array(TW),sinT=new Float32Array(TW);
  for(let i=0;i<TW;i++){const a=(i+0.5)/TW*TAU;cosT[i]=Math.cos(a);sinT[i]=Math.sin(a);}

  /* 域旋转 / 分形参数走独立 rng：不打乱主 rand 序列，
     星球名、宜居指数、卫星等元数据不随之变化，只有纹理形状变 */
  const frand=makeRng(seedStr+"|rot");
  const cfg={
    noise:rotNoise(makeNoise3D(makeRng(seedStr+"|n")),frand),
    worley:rotWorley(makeWorley3D(makeRng(seedStr+"|w")),frand),
    _prand:makeRng(seedStr+"|pal"),
    _o:new Float32Array(6),_wo:new Float32Array(3),_ice:new Float32Array(1),
    _cosT:cosT,_sinT:sinT,
    _G:{nx:0,ny:0,nz:0,lat:0,lon:0,u:0,v:0,storm:0,stormId:0},
    subIndex:subIdx,
    traits:[]
  };
  bm.init(rand,cfg);

  // 卫星
  const moons=[];
  const nm=chance(rand,0.72)?rint(rand,1,bm===BIOMES.gas?7:3):0;
  for(let i=0;i<nm;i++){
    let sz=rnd(rand,2.2,6.5),giant=false;
    if(rand()<0.10){sz*=rnd(rand,1.9,2.7);giant=true;} /* 10% 偶发巨月 */
    moons.push({
      d:rnd(rand,1.35,2.6)+i*0.22,
      sp:rnd(rand,0.06,0.3)/(1+i*0.4),
      ph:rand()*TAU,
      sz:sz,
      col:hsl2rgb(rnd(rand,0,360),rnd(rand,6,32),rnd(rand,42,76)),
      tilt:rnd(rand,0.15,0.7)*(rand()<0.5?-1:1),
      giant:giant,
      style:(rand()*4)|0,   /* 0 素面 1 陨击坑 2 条纹 3 环带 */
      mt:rand()*TAU         /* 表面细节相位（坑位 / 条纹走向） */
    });
  }

  const tex=await buildTextureAsync(cfg,onProg);

  const st=genStats(rand,bm,cfg.traits);
  st.moons=nm;

  const traits=cfg.traits.slice();
  if(nm===0)traits.push("无天然卫星");
  else if(nm>3)traits.push("复杂卫星系");
  if(st.rot>200)traits.push("潮汐锁定倾向");
  if(rand()<0.16)traits.push("逆行自转");
  if(st.grav>1.6)traits.push("高重力环境");
  else if(st.grav<0.4)traits.push("低重力环境");

  const nmz=genName(rand,bm);
  const traitSet=Array.from(new Set(traits));
  /* 自转方向由「逆行自转」词条决定，保证词条与实际观感一致：
     spinDir=-1 顺行 —— 画面上的地貌向右走（绝大多数天体）
     spinDir=+1 逆行 —— 地貌向左走 */
  const retro=traitSet.includes("逆行自转");

  return {
    seed:seedStr,type:tkey,biome:bm,
    sub:cfg.subName||"",subIndex:cfg.subIndex,
    tex:tex,atmos:cfg.atmos,ambient:cfg.ambient,limb:cfg.limb,
    hasCloud:cfg.hasCloud,cloudMul:cfg.cloudMul||1,
    moons:moons,
    name:nmz.name,epi:nmz.epi,
    stats:st,traits:traitSet,
    spinDir:retro?1:-1,
    cloudDir:rand()<0.5?1:-1
  };
}
/* 种子格式：类型[-亚型序号]-随机盐
   例：metal-2-k3f9xq  → 机械造物 · 电路板型
   旧格式 terran-k3f9xq 仍然可用（亚型随机） */
function parseSeed(s){
  const parts=String(s).split("-");
  if(parts.length>=2&&BIOMES[parts[0]]){
    let sub=null,salt=parts.slice(1).join("-");
    if(parts.length>=3&&/^\d{1,2}$/.test(parts[1])){
      sub=+parts[1];salt=parts.slice(2).join("-");
    }
    return [parts[0],sub,salt];
  }
  return ["terran",null,String(s)];
}
function newSeed(tkey,sub){
  if(!tkey){
    // 加权随机
    let tot=0;for(const k of BIOME_KEYS)tot+=BIOMES[k].weight;
    let r=Math.random()*tot;
    for(const k of BIOME_KEYS){r-=BIOMES[k].weight;if(r<=0){tkey=k;break;}}
  }
  const salt=Math.random().toString(36).slice(2,7)+Math.random().toString(36).slice(2,5);
  return tkey+(sub==null?"":"-"+sub)+"-"+salt;
}

/* ═══════════════════════════════════════════════════════════════
   球面渲染：CPU 纹理生成 + WebGL2 着色器光照
   ═══════════════════════════════════════════════════════════════ */
/* 内部渲染半径：随分辨率档位等比放大（240 = 画布 900×640 下 1:1 像素密度） */
let RR=240,RW=480;
/* WebGL2 球面渲染器：CPU 生成的纹理上传为 GPU 采样器，
   光照 / 大气 / 细节层级全部在片元着色器里逐像素算（原 LUT + 取样循环） */
const pcv=document.createElement("canvas");
const gl=pcv.getContext("webgl2",{alpha:true,antialias:false,preserveDrawingBuffer:false});
function rebuildRenderTargets(){
  RW=RR*2;
  pcv.width=RW;pcv.height=RW;
}
rebuildRenderTargets();

const GL_VS=`#version 300 es
void main(){
  vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
  gl_Position=vec4(p*2.0-1.0,0.0,1.0);
}`;
const GL_FS=`#version 300 es
precision highp float;
uniform sampler2D uTexA;   /* rgb=albedo  a=emissive */
uniform sampler2D uTexB;   /* r=spec      g=cloud    */
uniform float uRot,uRR,uAmb,uLimb,uAtmS,uHasCloud;
uniform vec2 uTexWH;
uniform vec3 uLight,uAtm;
out vec4 fragColor;
void main(){
  float dy=(uRR-gl_FragCoord.y)/uRR;
  float cp2=1.0-dy*dy;
  if(cp2<=0.0)discard;
  float cp=sqrt(cp2);
  float dx=(gl_FragCoord.x-uRR)/uRR;
  float s=dx/cp;
  if(s<=-1.0||s>=1.0)discard;
  float nz=sqrt(max(0.0,1.0-dx*dx-dy*dy));
  float texW=uTexWH.x,texH=uTexWH.y;
  float uu=fract(asin(s)/6.2831853+uRot)*texW;
  float vv=min((0.5-asin(dy)/3.1415927)*texH,texH-1.0);
  vec2 uv=vec2((uu+0.5)/texW,(vv+0.5)/texH);
  /* 解析 LOD：正交投影下每个屏幕像素覆盖的纹素数随 |s| 与 1/cp 发散，
     对应原 CPU 版的两级边缘降采样 */
  float dH=texW/(6.2831853*cp*sqrt(max(1e-4,1.0-s*s)))/uRR;
  float dV=texH/(3.1415927*cp)/uRR;
  float lod=log2(max(1.0,max(dH,dV)));
  vec4 A=textureLod(uTexA,uv,lod);
  vec4 B=textureLod(uTexB,uv,lod);
  vec3 n=vec3(dx,dy,nz);
  float ndl=dot(n,uLight);
  float lam=uAmb+(1.0-uAmb)*pow(clamp((ndl+0.12)/1.12,0.0,1.0),0.85);
  float rr=1.0-nz;
  float rim=pow(rr,2.6)*(0.25+0.75*clamp(ndl,0.0,1.0));
  vec3 hv=normalize(vec3(uLight.xy,uLight.z+1.0));
  float sd=clamp(dot(n,hv),0.0,1.0);
  float spec=pow(sd,5.5)*clamp(ndl*3.0,0.0,1.0)*0.3;
  float e=A.a*(1.0-uLimb*pow(rr,1.5));
  float ee=e*e*0.4627451;
  vec3 col=A.rgb*(lam+e*1.06)+vec3(ee+B.r*spec);
  if(uHasCloud>0.5&&B.g>0.004)
    col=mix(col,vec3(0.9803922,0.9882353,1.0)*(lam*1.06),B.g);
  col+=uAtm*rim*uAtmS;
  fragColor=vec4(clamp(col,0.0,1.0),1.0);
}`;
function glShader(type,src){
  const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
const glProg=gl.createProgram();
gl.attachShader(glProg,glShader(gl.VERTEX_SHADER,GL_VS));
gl.attachShader(glProg,glShader(gl.FRAGMENT_SHADER,GL_FS));
gl.linkProgram(glProg);
if(!gl.getProgramParameter(glProg,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(glProg));
const GLU={};
for(const nm of["uRot","uRR","uAmb","uLimb","uAtmS","uHasCloud","uTexWH","uLight","uAtm","uTexA","uTexB"])
  GLU[nm]=gl.getUniformLocation(glProg,nm);
const glTexA=gl.createTexture(),glTexB=gl.createTexture();
for(const t of[glTexA,glTexB]){
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
}
gl.uniform1i(GLU.uTexA,0);gl.uniform1i(GLU.uTexB,1);
let glBoundTex=null;

/* ───────── 星球分辨率档位 ─────────
   三层必须同一个倍率一起走：只提画布输出，球面仍是 240 像素半径，放大后照样糊；
   只提球面，纹理纹素又比像素粗，细节仍是空壳。代价是内存与合成耗时按 k² 增长 */
const RES_STEPS=[
  {k:1,  name:"标准", tex:"1024×512"},
  {k:1.5,name:"高清", tex:"1536×768"},
  {k:2,  name:"极致", tex:"2048×1024"}
];
let resIdx=0;
function setResolution(i){
  const st=RES_STEPS[i];
  if(!st)return;
  if(i===resIdx){$("resSel").value=String(resIdx);return;}
  if(generating){$("resSel").value=String(resIdx);toast("合成中，稍后再切换分辨率");return;}
  resIdx=i;
  TW=Math.round(1024*st.k);TH=Math.round(512*st.k);
  RR=Math.round(240*st.k);
  rebuildRenderTargets();
  OUT=st.k;
  applyCanvasSize();
  toast("分辨率 "+st.name+" · 纹理 "+TW+"×"+TH+" · 画布 "+Math.round(VW*OUT)+"×"+Math.round(VH*OUT));
  /* 同一颗星按新分辨率重合成：种子与自转相位都保持，只是更清晰 */
  if(CUR)safeGenerate(CUR.seed,{keepPhase:true,noCount:true});
}
window.__LIGHT={x:-0.6,y:-0.3,z:0.74};
function setLight(angDeg,elevDeg){
  const a=angDeg*PI/180,e=elevDeg*PI/180;
  window.__LIGHT={x:Math.cos(e)*Math.sin(a),y:-Math.sin(e),z:Math.cos(e)*Math.cos(a)};
}

/* 纹理上传：alb+em 打包进一张 RGBA，spec+cld 打包进另一张，一次生成完整 mip 链 */
function uploadSphereTexture(tex){
  const n=tex.w*tex.h;
  const a=new Uint8Array(n*4),b=new Uint8Array(n*4);
  for(let i=0;i<n;i++){
    const i3=i*3,i4=i<<2;
    a[i4]=tex.alb[i3];a[i4+1]=tex.alb[i3+1];a[i4+2]=tex.alb[i3+2];a[i4+3]=tex.em[i];
    b[i4]=tex.spec[i];b[i4+1]=tex.cld[i];
  }
  for(const[t,data]of[[glTexA,a],[glTexB,b]]){
    gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,tex.w,tex.h,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
    gl.generateMipmap(gl.TEXTURE_2D);
  }
  glBoundTex=tex;
}
function renderSphere(P,phase){
  if(pcv.width!==RW){pcv.width=RW;pcv.height=RW;}
  if(glBoundTex!==P.tex)uploadSphereTexture(P.tex);
  gl.viewport(0,0,RW,RW);
  gl.clearColor(0,0,0,0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(glProg);
  gl.uniform1i(GLU.uTexA,0);gl.uniform1i(GLU.uTexB,1);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,glTexA);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,glTexB);
  const at=P.atmos.col,L=window.__LIGHT;
  gl.uniform1f(GLU.uRot,phase);
  gl.uniform1f(GLU.uRR,RR);
  gl.uniform1f(GLU.uAmb,P.ambient);
  gl.uniform1f(GLU.uLimb,P.limb);
  gl.uniform1f(GLU.uAtmS,P.atmos.str);
  gl.uniform1f(GLU.uHasCloud,P.hasCloud?1:0);
  gl.uniform2f(GLU.uTexWH,P.tex.w,P.tex.h);
  gl.uniform3f(GLU.uLight,L.x,L.y,L.z);
  gl.uniform3f(GLU.uAtm,at[0]/255,at[1]/255,at[2]/255);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ═══════════════════════════════════════════════════════════════
   背景：纯黑星空
   ═══════════════════════════════════════════════════════════════ */
const cv=document.getElementById("scene");
const ctx=cv.getContext("2d");
/* 逻辑坐标系固定 900×640：取景半径、卫星、光圈全部按它书写。
   画布输出倍率 OUT 只改内部像素数与 ctx 缩放 ——
   布局、取景、DOM 叠加层（角标 / 提示 / 内嵌控件）都不用跟着改 */
const VW=900,VH=640;
const CW=VW,CH=VH,CX=VW/2,CY=VH/2;
let OUT=1;
const bg=document.createElement("canvas");
const bgx=bg.getContext("2d");
const vpEl=document.querySelector(".viewport");
/* 画布按可用空间等比缩放（上限 1:1，不放大以避免糊化），
   保证横屏下整页无需滚动即可完整呈现；
   OUT>1 时内部像素更多而 CSS 尺寸不变 → 高分屏下更锐 */
function fitCanvas(){
  const k=Math.min(vpEl.clientWidth/cv.width,vpEl.clientHeight/cv.height,1);
  cv.style.width=Math.floor(cv.width*k)+"px";
  cv.style.height=Math.floor(cv.height*k)+"px";
}
addEventListener("resize",fitCanvas);
/* 输出倍率切换：重设内部像素 → 重置 ctx 状态 → 重设等比缩放 → 重绘星空 */
function applyCanvasSize(){
  cv.width=Math.round(VW*OUT);cv.height=Math.round(VH*OUT);
  bg.width=cv.width;bg.height=cv.height;
  ctx.setTransform(OUT,0,0,OUT,0,0);
  bgx.setTransform(OUT,0,0,OUT,0,0);
  fitCanvas();
  drawBG();
}

const STARS=[];
for(let i=0;i<360;i++){
  STARS.push({x:Math.random()*CW,y:Math.random()*CH,r:Math.random()*0.95+0.25,
    a:Math.random()*0.7+0.3,tw:Math.random()*TAU,sp:Math.random()*1.4+0.3,
    c:Math.random()<0.12?"#cfe0ff":"#ffffff"});
}
function drawBG(){
  bgx.clearRect(0,0,CW,CH);
  bgx.fillStyle="#000";bgx.fillRect(0,0,CW,CH);
  for(const s of STARS){
    const a=s.a*(0.7+0.3*Math.sin(s.tw));
    bgx.globalAlpha=a;bgx.fillStyle=s.c;
    bgx.beginPath();bgx.arc(s.x,s.y,s.r,0,TAU);bgx.fill();
  }
  bgx.globalAlpha=1;
}

/* 大气外辉光 */
function drawGlow(P,Rs){
  const a=P.atmos.col,st=P.atmos.str;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  ctx.translate(CX,CY);
  const g=ctx.createRadialGradient(0,0,Rs*0.9,0,0,Rs*(1.35+st*0.55));
  g.addColorStop(0,"rgba("+a[0]+","+a[1]+","+a[2]+","+(0.30*st)+")");
  g.addColorStop(0.45,"rgba("+a[0]+","+a[1]+","+a[2]+","+(0.11*st)+")");
  g.addColorStop(1,"rgba("+a[0]+","+a[1]+","+a[2]+",0)");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,Rs*(1.4+st*0.6),0,TAU);ctx.fill();
  ctx.restore();
}

/* 卫星 */
function drawMoons(P,Rs,t,front){
  const L=window.__LIGHT;
  /* 屏幕平面光向（与行星 LUT 同一 y 向下约定），供巨月明暗渐变定向 */
  let lx=L.x,ly=L.y;
  const ll=Math.sqrt(lx*lx+ly*ly);
  if(ll<0.05){lx=0;ly=-1;}else{lx/=ll;ly/=ll;}
  for(const m of P.moons){
    const ph=m.ph+t*m.sp;
    const sx=CX+Math.cos(ph)*Rs*m.d;
    const sy=CY+Math.sin(ph)*Rs*m.d*m.tilt;
    const z=Math.sin(ph);
    if((z>0)!==front)continue;
    const sz=Math.max(1.2,m.sz*(Rs/170));
    const lit=clamp01(Math.cos(ph-0)*0.5+0.5)*0.6+0.4;
    ctx.beginPath();ctx.arc(sx,sy,sz,0,TAU);
    const c=m.col;
    const k=0.35+0.65*clamp01((L.x*Math.cos(ph)+L.z*0.6)*0.5+0.6);
    if(m.giant&&sz>=4){
      /* 巨月：立体渲染 —— 平涂底色 + 表面细节，再乘一层径向明暗渐变
         （亮面中心朝向光源、相位越暗高光越沉入暗侧），与星球的
         Lambert 感观一致。细节不再受 z 门控：前后两圈观感连续，
         跨越 z=0 时不会瞬间丢纹理 */
      ctx.save();
      ctx.beginPath();ctx.arc(sx,sy,sz,0,TAU);ctx.clip();
      ctx.fillStyle="rgb("+c[0]+","+c[1]+","+c[2]+")";
      ctx.fillRect(sx-sz,sy-sz,sz*2,sz*2);
      if(m.style===1){          /* 陨击坑：暗坑盘 + 背光侧被照亮的内壁 */
        const nc=2+Math.min(4,sz|0);
        for(let j=0;j<nc;j++){
          const a=m.mt*3.1+j*2.39996;
          const rr=sz*(0.10+((j*37)%10)/38);
          const ox=sx+Math.cos(a)*sz*0.55,oy=sy+Math.sin(a*1.7)*sz*0.55;
          ctx.fillStyle="rgba(255,255,255,.04)";
          ctx.beginPath();ctx.arc(ox-lx*rr*0.25,oy-ly*rr*0.25,rr*0.9,0,TAU);ctx.fill();
          ctx.fillStyle="rgba(0,0,0,.08)";
          ctx.beginPath();ctx.arc(ox,oy,rr,0,TAU);ctx.fill();
        }
      }else if(m.style===2){    /* 条纹 */
        ctx.strokeStyle="rgba(0,0,0,.20)";
        ctx.lineWidth=Math.max(1,sz*0.14);
        for(let j=-1;j<=1;j++){
          const oy=sy+j*sz*0.52;
          ctx.beginPath();ctx.moveTo(sx-sz,oy);ctx.lineTo(sx+sz,oy);ctx.stroke();
        }
      }else if(m.style===3){    /* 环带 */
        ctx.fillStyle="rgba(255,255,255,.14)";
        ctx.fillRect(sx-sz,sy-sz*0.38,sz*2,sz*0.32);
        ctx.fillStyle="rgba(0,0,0,.16)";
        ctx.fillRect(sx-sz,sy+sz*0.06,sz*2,sz*0.26);
      }
      /* 立体明暗：乘法渐变（白=亮面不变色 → 深灰=暗面压暗） */
      const off=sz*(0.30+(1-k)*0.95);
      const b=Math.min(255,Math.round(255*Math.min(1,k*1.2)));
      const d=Math.round(255*k*0.30);
      const g=ctx.createRadialGradient(sx+lx*off,sy+ly*off,0,sx,sy,sz*1.15);
      g.addColorStop(0,"rgb("+b+","+b+","+b+")");
      g.addColorStop(0.6,"rgb("+Math.round(b*0.8)+","+Math.round(b*0.8)+","+Math.round(b*0.8)+")");
      g.addColorStop(1,"rgb("+d+","+d+","+d+")");
      ctx.globalCompositeOperation="multiply";
      ctx.fillStyle=g;
      ctx.fillRect(sx-sz,sy-sz,sz*2,sz*2);
      ctx.globalCompositeOperation="source-over";
      ctx.restore();
      ctx.beginPath();ctx.arc(sx,sy,sz,0,TAU);
      ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=1;ctx.stroke();
      continue;
    }
    ctx.fillStyle="rgb("+(c[0]*k|0)+","+(c[1]*k|0)+","+(c[2]*k|0)+")";
    ctx.fill();
    if(z>0){
      /* 表面细节：硬边平涂、无模糊（与整体美术一致），仅限朝向观察者一面 */
      if(sz>=3.2&&m.style>0){
        ctx.save();
        ctx.beginPath();ctx.arc(sx,sy,sz,0,TAU);ctx.clip();
        if(m.style===1){          /* 陨击坑 */
          ctx.fillStyle="rgba(0,0,0,.18)";
          for(let j=0;j<4;j++){
            const a=m.mt*3.1+j*2.4;
            const rr=sz*(0.14+((j*37)%10)/45);
            ctx.beginPath();
            ctx.arc(sx+Math.cos(a)*sz*0.52,sy+Math.sin(a*1.7)*sz*0.52,rr,0,TAU);
            ctx.fill();
          }
        }else if(m.style===2){    /* 条纹 */
          ctx.strokeStyle="rgba(0,0,0,.20)";
          ctx.lineWidth=Math.max(1,sz*0.16);
          for(let j=-1;j<=1;j++){
            const oy=sy+j*sz*0.5;
            ctx.beginPath();ctx.moveTo(sx-sz,oy);ctx.lineTo(sx+sz,oy);ctx.stroke();
          }
        }else if(m.style===3){    /* 环带 */
          ctx.fillStyle="rgba(255,255,255,.16)";
          ctx.fillRect(sx-sz,sy-sz*0.34,sz*2,sz*0.30);
          ctx.fillStyle="rgba(0,0,0,.14)";
          ctx.fillRect(sx-sz,sy+sz*0.06,sz*2,sz*0.26);
        }
        ctx.restore();
      }
      ctx.beginPath();ctx.arc(sx,sy,sz,0,TAU);
      ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=1;ctx.stroke();
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   主循环
   ═══════════════════════════════════════════════════════════════ */
let CUR=null;
let phase=0,cloudPhase=0,tSec=0;
let zoom=1;
let paused=false;
/* 自转：每秒转过的圈数（0.04 ≈ 25 秒一圈），方向由星球自身的 spinDir 决定 */
let rotSpeed=0.04;
/* 光照出厂值：方位角 / 仰角，供「光照归位」按钮回位 */
const LIGHT_DEF=-38,ELEV_DEF=18;
let lightAng=LIGHT_DEF,elev=ELEV_DEF;
let dragLight=false;
let last=performance.now();

const wrapDeg=d=>{let x=((d+180)%360+360)%360-180;return x;};

function frame(now){
  const dt=Math.min(80,now-last);last=now;
  if(!paused)tSec+=dt;
  if(CUR){
    if(!paused){
      phase+=rotSpeed*(dt/1000)*CUR.spinDir;
      cloudPhase+=rotSpeed*(dt/1000)*CUR.cloudMul*CUR.cloudDir;
      phase-=Math.floor(phase);cloudPhase-=Math.floor(cloudPhase);
    }
    for(const s of STARS)s.tw+=dt/1000*s.sp;
    setLight(lightAng,elev);
    const Rs=170*zoom;
    ctx.clearRect(0,0,CW,CH);
    ctx.drawImage(bg,0,0,CW,CH);
    drawMoons(CUR,Rs,tSec/1000,false);
    renderSphere(CUR,phase);
    ctx.drawImage(pcv,CX-Rs,CY-Rs,Rs*2,Rs*2);
    drawGlow(CUR,Rs);
    drawMoons(CUR,Rs,tSec/1000,true);
    drawLightGizmo(Rs,dragLight);
  }
  requestAnimationFrame(frame);
}

/* 光源方向指示器：始终显示一个淡淡的「太阳」标记，
   拖动 / 巡航时高亮并标注角度，让拖动操作有即时反馈 */
function drawLightGizmo(Rs,active){
  const L=window.__LIGHT;
  const sx=CX+L.x*Rs*1.78,sy=CY+L.y*Rs*1.78;
  ctx.save();
  if(active){
    ctx.setLineDash([3,5]);ctx.strokeStyle="rgba(255,225,150,.34)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(CX+L.x*Rs*1.06,CY+L.y*Rs*1.06);ctx.lineTo(sx,sy);ctx.stroke();
    ctx.setLineDash([]);
  }
  const rad=active?17:11,a=active?0.6:0.26;
  const g=ctx.createRadialGradient(sx,sy,0,sx,sy,rad);
  g.addColorStop(0,"rgba(255,240,190,"+a+")");
  g.addColorStop(0.4,"rgba(255,200,90,"+(a*0.42)+")");
  g.addColorStop(1,"rgba(255,180,60,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,rad,0,TAU);ctx.fill();
  ctx.fillStyle="rgba(255,244,214,"+(active?0.95:0.5)+")";
  ctx.beginPath();ctx.arc(sx,sy,active?3.8:2.6,0,TAU);ctx.fill();
  if(active){
    ctx.font='11px ui-monospace,SFMono-Regular,Consolas,monospace';
    ctx.textAlign="center";ctx.textBaseline="middle";
    const label=Math.round(lightAng)+"° / "+Math.round(elev)+"°";
    const ty=sy-22<10?sy+22: sy-22;
    ctx.fillStyle="rgba(4,8,16,.72)";
    const w=ctx.measureText(label).width+12;
    ctx.fillRect(sx-w/2,ty-8,w,16);
    ctx.fillStyle="rgba(255,236,180,.95)";
    ctx.fillText(label,sx,ty);
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   UI
   ═══════════════════════════════════════════════════════════════ */
const $=id=>document.getElementById(id);
const loader=$("loader"),loadtxt=$("loadtxt");
let count=0,arch=[];

function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1900);
}
function fmt(n){
  if(n>=1e6)return (n/1e6).toFixed(2)+" 万";
  return n.toLocaleString("zh-CN");
}

let generating=false;
async function generate(seedStr,opts){
  if(generating)return;
  const o=opts||{};
  generating=true;
  const btn=$("btnGen");btn.disabled=true;
  loader.classList.add("on");
  $("vptag").textContent="SCAN // 合成中";
  loadtxt.textContent="正在合成星体… 0%";
  await new Promise(r=>setTimeout(r,24));
  const P=await createPlanet(seedStr,p=>{
    loadtxt.textContent="正在合成星体… "+Math.round(p*100)+"%";
  });
  CUR=P;
  /* 换分辨率重合成时保留自转相位与合成计数：画面不跳、计数不虚增 */
  if(!o.keepPhase){phase=Math.random();cloudPhase=Math.random();}
  drawBG();
  updateInfo(P);
  $("seedInput").value=seedStr;
  if(!o.noCount){count++;$("cnt").textContent=count;}
  $("vptag").textContent="SCAN // "+P.biome.en+" · "+P.name;
  loader.classList.remove("on");
  btn.disabled=false;generating=false;
}

/* 安全版生成：任何异常都不会让按钮永久卡死 */
function safeGenerate(seedStr,opts){
  generate(seedStr,opts).catch(err=>{
    console.error(err);
    loader.classList.remove("on");
    $("btnGen").disabled=false;
    generating=false;
    toast("生成失败，已恢复操作");
  });
}

function updateInfo(P){
  const bm=P.biome,s=P.stats;
  const tt=$("typetag");
  tt.style.color=bm.color;
  tt.querySelector("span").textContent=bm.name+" · "+bm.en+(P.sub?" · "+P.sub:"");
  $("pname").textContent=P.name;
  $("pepi").textContent=P.epi;
  $("pseed").textContent=P.seed;
  $("pdesc").textContent=describe(P);

  const rows=[
    ["直径 DIAMETER",fmt(s.dia)+" <small>km</small>"],
    ["质量 MASS",s.mass<0.01?s.mass.toExponential(2):s.mass.toFixed(s.mass<10?2:1)+" <small>M⊕</small>"],
    ["表面重力",s.grav.toFixed(2)+" <small>g</small>"],
    ["平均温度",s.temp+" <small>°C</small>"],
    ["自转周期",s.rot+" <small>h</small>"],
    ["轨道周期",s.orb?s.orb+" <small>d</small>":"—"],
    ["卫星数量",s.moons+" <small>颗</small>"]
  ];
  let html="";
  for(const [k,v] of rows)html+='<div class="st"><div class="k">'+k+'</div><div class="v">'+v+"</div></div>";
  html+='<div class="st wide"><div class="k">大气成分 ATMOSPHERE</div><div class="v" style="font-size:13px">'+s.atmos+"</div></div>";
  html+='<div class="st wide"><div class="k">主要资源 RESOURCES</div><div class="v" style="font-size:13px">'+s.res.join(" · ")+"</div></div>";
  $("stats").innerHTML=html;

  $("habV").textContent=s.hab+" / 100 · "+habLabel(s.hab);
  $("habBar").style.width=s.hab+"%";
  $("hazV").textContent=hazLabel(s.haz);
  $("hazBar").style.width=s.haz+"%";

  const cls=["","",""];
  $("traits").innerHTML=P.traits.map((t,i)=>{
    const c=i%5===0?"gold":(i%3===0?"warn":(i%4===0?"good":""));
    return '<span class="chip '+c+'">'+t+"</span>";
  }).join("");
}
function describe(P){
  const s=P.stats,bm=P.biome;
  const parts=[];
  parts.push("一颗"+bm.name+(P.sub?"（"+P.sub+"）":""));
  if(s.dia>50000)parts.push("体积远超标准类地行星");
  else if(s.dia<5000)parts.push("尺寸小于多数类地世界");
  parts.push("地表平均温度 "+s.temp+"°C");
  parts.push(s.atmos);
  if(s.hab>60)parts.push("具备直接殖民潜力");
  else if(s.hab>30)parts.push("需加压密闭设施方可驻留");
  else parts.push("环境极端，仅适合无人探测");
  parts.push("。");
  return parts.join("，").replace("，，","，");
}

/* 档案 */
function addArchive(P){
  const c=document.createElement("canvas");c.width=112;c.height=112;
  const x=c.getContext("2d");
  const s=Math.min(CW,CH)*0.42;
  /* 源矩形按画布内部像素取（逻辑尺寸 × OUT），否则输出倍率一高就只截到左上角 */
  x.drawImage(cv,(CX-s)*OUT,(CY-s)*OUT,s*2*OUT,s*2*OUT,0,0,112,112);
  arch.unshift({seed:P.seed,name:P.name,type:P.biome.name,color:P.biome.color,url:c.toDataURL("image/png")});
  if(arch.length>24)arch.pop();
  renderArch();
}
function renderArch(){
  const el=$("arch");
  if(!arch.length){el.innerHTML='<div class="empty">暂无记录</div>';return;}
  el.innerHTML=arch.map((a,i)=>
    '<div class="arc" data-i="'+i+'" title="'+a.name+" · "+a.type+"\nSEED: "+a.seed+'">'+
    '<img src="'+a.url+'" alt="'+a.name+'"><span>'+a.name+"</span></div>").join("");
  el.querySelectorAll(".arc").forEach(n=>{
    n.onclick=()=>{const a=arch[+n.dataset.i];$("seedInput").value=a.seed;generate(a.seed);};
  });
}

/* ── 亚型（细分形态）下拉 ── */
function fillSubSel(tkey,keep){
  const sub=$("subSel");
  const bm=BIOMES[tkey];
  if(!bm){
    sub.innerHTML='<option value="">✦ 亚型随机（随大类）</option>';
    sub.disabled=true;sub.title="先选择具体大类，才能指定亚型";
    return;
  }
  sub.disabled=false;sub.title="指定该大类下的细分形态";
  sub.innerHTML='<option value="">✦ 亚型随机</option>'+
    bm.subs.map((s,i)=>'<option value="'+i+'">'+(i+1)+". "+s.name+"</option>").join("");
  if(keep!=null&&keep!==undefined&&bm.subs[keep])sub.value=String(keep);
}
/* 当前 UI 上选中的亚型（null = 随机） */
function curSubChoice(tkey){
  const sub=$("subSel");
  if(!tkey||sub.disabled||sub.value==="")return null;
  const i=+sub.value;
  return (BIOMES[tkey]&&BIOMES[tkey].subs[i])?i:null;
}
/* 光照拖拽 / 归位后把缩放数值同步回控件（光源与仰角已无滑块） */
function syncLightUI(){
  $("vZoom").textContent=zoom.toFixed(2);
}

/* 事件绑定 */
function initUI(){
  const sel=$("typeSel");
  sel.innerHTML='<option value="">✦ 完全随机（加权）</option>'+
    BIOME_KEYS.map(k=>'<option value="'+k+'">'+BIOMES[k].name+" · "+BIOMES[k].en+"</option>").join("");
  fillSubSel(sel.value||null);
  sel.onchange=()=>fillSubSel(sel.value||null);

  /* 标签式面板切换 */
  $("tabs").addEventListener("click",e=>{
    const b=e.target.closest("button[data-tab]");if(!b)return;
    const k=b.dataset.tab;
    for(const n of $("tabs").children)n.classList.toggle("on",n===b);
    for(const n of document.querySelectorAll(".tabpane"))n.classList.toggle("on",n.dataset.pane===k);
  });

  $("btnGen").onclick=()=>safeGenerate(newSeed(sel.value||null,curSubChoice(sel.value||null)));
  $("btnReroll").onclick=()=>{
    const t=(sel.value||(CUR?CUR.type:null));
    if(!t)return safeGenerate(newSeed(null));
    let sub=curSubChoice(t);
    // 亚型为「随机」时，主动避开当前亚型，保证重掷一定换纹理而不是只换色
    if(sub==null&&CUR&&CUR.type===t&&BIOMES[t].subs.length>1){
      let i=CUR.subIndex,guard=0;
      while(i===CUR.subIndex&&guard++<12)i=Math.floor(Math.random()*BIOMES[t].subs.length);
      sub=i;
    }
    safeGenerate(newSeed(t,sub));
  };
  $("btnSeed").onclick=()=>{
    const v=$("seedInput").value.trim();
    if(!v){toast("请先输入种子");return;}
    safeGenerate(v);
  };
  $("seedInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("btnSeed").click();});

  /* 星球分辨率：档位切换会立刻按同一颗星的种子重合成（不换星、不重置自转） */
  const resSel=$("resSel");
  resSel.innerHTML=RES_STEPS.map((r,i)=>
    '<option value="'+i+'">画质 '+r.name+" "+r.k+"× · "+r.tex+"</option>").join("");
  resSel.value=String(resIdx);
  resSel.onchange=()=>setResolution(+resSel.value);

  /* 暂停 / 继续：冻结自转与卫星公转（星点闪烁保持，画面不僵死） */
  $("btnPause").onclick=e=>{
    paused=!paused;
    e.target.textContent=paused?"▶":"⏸";
    e.target.title=paused?"继续":"暂停";
    e.target.classList.toggle("on",paused);
  };
  /* 光照归位：方位角与仰角回到出厂值（拖动改过的取景角度一键还原） */
  $("btnLightReset").onclick=()=>{
    lightAng=LIGHT_DEF;elev=ELEV_DEF;
    syncLightUI();
    toast("光照已归位 · "+LIGHT_DEF+"° / "+ELEV_DEF+"°");
  };
  $("btnSave").onclick=()=>{if(CUR){addArchive(CUR);toast("已存入观测档案");}};
  $("btnPng").onclick=()=>{
    if(!CUR)return;
    cv.toBlob(b=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(b);
      a.download=CUR.name.replace(/[^\w\-]+/g,"_")+"_"+CUR.seed+".png";
      a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      toast("已导出 PNG");
    });
  };
  /* 缩放：预览窗内 ＋ / － 与桌面滚轮共用同一条缩放路径。
     上限放到 2.4 倍（画布 900×640 内行星可超出视野），按钮步进 12% 便于快速到位 */
  const setZoom=z=>{
    zoom=clamp(z,0.6,2.4);
    $("vZoom").textContent=zoom.toFixed(2);
  };
  $("btnZoomIn").onclick=()=>setZoom(zoom*1.12);
  $("btnZoomOut").onclick=()=>setZoom(zoom/1.12);

  /* 画布交互：拖动采用「相对位移」而不是绝对坐标，
     横向 1 屏宽 ≈ 方位角 300°、纵向 1 屏高 ≈ 仰角 110°，手感线性可预期 */
  let drag=false,sx=0,sy=0,sAng=0,sEl=0;
  const endDrag=()=>{if(!drag)return;drag=false;dragLight=false;cv.style.cursor="grab";};
  cv.addEventListener("pointerdown",e=>{
    drag=true;dragLight=true;
    cv.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;sAng=lightAng;sEl=elev;
    cv.style.cursor="grabbing";
  });
  cv.addEventListener("pointerup",endDrag);
  cv.addEventListener("pointercancel",endDrag);
  cv.addEventListener("pointermove",e=>{
    if(!drag)return;
    const r=cv.getBoundingClientRect();
    if(!r.width||!r.height)return;
    const dx=(e.clientX-sx)/r.width,dy=(e.clientY-sy)/r.height;
    lightAng=wrapDeg(sAng+dx*300);
    elev=clamp(sEl-dy*110,-60,70);
    syncLightUI();
  });
  cv.addEventListener("wheel",e=>{
    e.preventDefault();
    setZoom(zoom*(e.deltaY>0?0.94:1.06));
  },{passive:false});
  cv.addEventListener("dblclick",()=>$("btnPause").click());

  $("pseed").onclick=()=>{
    const t=$("pseed").textContent;
    navigator.clipboard?.writeText(t).then(()=>toast("种子已复制："+t),()=>toast("种子："+t));
  };

  /* 手机端（竖屏 / 矮屏横屏）：高频操作按钮条从顶栏搬到预览窗正下方，
     让「同型重掷 / 随机生成新星」落进拇指区；「存入档案 / 导出 PNG」留在右上角。
     两套版式共用同一批按钮，不复制 DOM、不重复绑事件 */
  const mqMobile=matchMedia(
    "(max-width:800px) and (orientation:portrait), (orientation:landscape) and (max-height:560px)");
  const placeTools=()=>{
    const t=$("tools"),op=$("oprow"),bar=document.querySelector("header.topbar");
    if(!t||!op||!bar)return;
    if(mqMobile.matches){ if(t.parentElement!==op)op.appendChild(t); }
    else if(t.parentElement!==bar)bar.insertBefore(t,$("toolright"));
  };
  placeTools();
  mqMobile.addEventListener("change",placeTools);
}

/* 启动 */
initUI();
applyCanvasSize();
requestAnimationFrame(frame);
generate(newSeed());
</script>
